version: "3.8"

services:
  paper-trade:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paper-trade
    environment:
      - NODE_ENV=production
      - PAPER_TRADE_SERVICE_PORT=3007
      - DATABASE_URL=mongodb://mongo:27017/trading_bot
    ports:
      - "3007:3007"
    depends_on:
      - mongo

  prisma:
    image: prismagraphql/prisma:1.34.10
    container_name: prisma
    environment:
      PRISMA_CONFIG: |
        port: 4466
        databases:
          default:
            connector: mongo
            uri: mongodb://mongo:27017/trading_bot
    ports:
      - "4466:4466"
    depends_on:
      - mongo

  mongo:
    image: mongo:5.0
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: trading_bot
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: